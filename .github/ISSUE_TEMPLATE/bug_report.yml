name: Bug report
description: 功能不符合预期、报错、数据异常
title: '[bug] '
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        谢谢反馈。请先确认已看过 README 与已有 issue；安全问题请走 [SECURITY.md](../SECURITY.md)，不要开公开 issue。
  - type: textarea
    id: what-happened
    attributes:
      label: 发生了什么
      description: 实际行为，以及你期望的行为
      placeholder: 点击「恢复备份」后页面停在加载态，刷新才恢复；期望是操作完成后直接刷新列表
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 从打开应用开始，一步一步写
      placeholder: |
        1. 设置 → Agents → 添加 Provider，Base URL 填 http://127.0.0.1:11434/v1
        2. 点「测试连接」
        3. …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 版本
      description: release 页面上的版本号，或 `git rev-parse --short HEAD`
      placeholder: v0.3.0 / 41392c5
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: 在哪一端出现
      options:
        - 浏览器（npm run dev）
        - 桌面版（安装包 / portable）
        - 两者都有
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 环境
      description: 系统、Node 版本、浏览器版本（桌面版写 Windows 版本即可）
      placeholder: Windows 11 26200 / Node 22.23 / Chrome 141
  - type: textarea
    id: logs
    attributes:
      label: 日志或截图
      description: |
        浏览器控制台、终端输出；桌面版可附 `%APPDATA%\\Aether\\main.log` 或 `server.log`。
        **请先把密钥、令牌、邮箱等敏感信息打码。**
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: 确认
      options:
        - label: 已在最新版本上复现
          required: true
        - label: 已搜索过 issue，没有重复
          required: true
