version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # Next and React move together; a lone bump usually breaks the build
      framework:
        patterns:
          - next
          - react
          - react-dom
          - eslint-config-next
      dev-tooling:
        dependency-type: development
        patterns:
          - eslint*
          - typescript
          - tailwindcss
          - postcss
          - autoprefixer
    ignore:
      # Electron majors are a manual upgrade: native rebuild + packaging check
      - dependency-name: electron
        update-types: ['version-update:semver-major']
      - dependency-name: electron-builder
        update-types: ['version-update:semver-major']
      # Next/React majors change the app router contract; upgrade deliberately
      - dependency-name: next
        update-types: ['version-update:semver-major']
      - dependency-name: react
        update-types: ['version-update:semver-major']
      - dependency-name: react-dom
        update-types: ['version-update:semver-major']
      - dependency-name: eslint-config-next
        update-types: ['version-update:semver-major']
      # eslint 10 breaks eslint-config-next 15's peer range; eslint majors here
      # must move together with Next.
      - dependency-name: eslint
        update-types: ['version-update:semver-major']
      # these three are on majors the app was not built against yet
      - dependency-name: lucide-react
        update-types: ['version-update:semver-major']
      - dependency-name: framer-motion
        update-types: ['version-update:semver-major']
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
