version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # Next and React move together; a lone bump usually breaks the build
      framework:
        patterns:
          - next
          - react
          - react-dom
          - eslint-config-next
      dev-tooling:
        dependency-type: development
        patterns:
          - eslint*
          - typescript
          - tailwindcss
          - postcss
          - autoprefixer
    ignore:
      # Electron majors are a manual upgrade: native rebuild + packaging check
      - dependency-name: electron
        update-types: ['version-update:semver-major']
      - dependency-name: electron-builder
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
