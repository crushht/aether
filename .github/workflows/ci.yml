name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # The PR gate. One command, the same one the loop runs locally:
  #   node scripts/autopilot.mjs --check --gates typecheck,regression --stash-on-fail
  # It writes .improve/gate-report.json + .improve/gate-report.md (the markdown is
  # the step summary) and one full log per gate under .improve/logs/. A failing
  # working tree is parked in `git stash` so a retry starts from a clean tree;
  # when nothing changed there is nothing to park and the report says so.
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # `git stash` creates a commit, which needs a committer identity
      - name: git identity
        run: |
          git config user.name "aether-ci"
          git config user.email "ci@aether.invalid"

      - name: autopilot --check (typecheck + regression)
        run: node scripts/autopilot.mjs --check --gates typecheck,regression --stash-on-fail

      # Always: the report is worth more on a red run than on a green one.
      - name: gate summary
        if: always()
        run: |
          if [ -f .improve/gate-report.md ]; then
            cat .improve/gate-report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "no gate report was written" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: upload gate logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-report
          path: |
            .improve/gate-report.md
            .improve/gate-report.json
            .improve/logs/*.log
            .improve/autopilot.log
          if-no-files-found: ignore
          retention-days: 14

  # Everything the gate does not cover: style, translations, the production
  # build and the flows that only break in a browser.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: lint
        run: npm run lint

      - name: translations
        run: npm run i18n

      - name: build
        run: npm run build

      - name: smoke — the auth endpoint answers and needs setup
        run: |
          npx next start -p 4399 & sleep 8
          curl -fsS http://127.0.0.1:4399/api/auth | tee /tmp/auth.json
          grep -q '"mode":"accounts"' /tmp/auth.json
          grep -q '"needsSetup":true' /tmp/auth.json
          pkill -f "next start" || true
          sleep 2

      - name: browser smoke — the three flows that break most often
        env:
          AUTH_DISABLED: '1'
          LAB_DATA_DIR: ${{ github.workspace }}/.e2e-data
          AETHER_BACKUP_INTERVAL_MS: '0'
        run: |
          # the dev server must own 4321: a stray `next start` would serve a
          # production build that still requires an account
          if curl -fsS http://127.0.0.1:4321/api/auth > /dev/null 2>&1; then
            echo "port 4321 is already taken"; exit 1
          fi
          npm run dev > /tmp/dev.log 2>&1 &
          for i in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:4321/api/auth > /dev/null 2>&1; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:4321/api/auth > /dev/null
          # warm the routes so the first paint is not a cold compile
          for route in /team/ENG /search /settings/data /inbox; do
            curl -fsS "http://127.0.0.1:4321$route" > /dev/null || true
          done
          sleep 5
          node scripts/e2e.mjs
          node scripts/e2e-search-page.mjs
          node scripts/e2e-workspace-backups.mjs
          pkill -f "next dev" || true
